<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Himalayan Plant Disease Identification</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2d5a3d;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            margin: 20px;
            padding: 10px;
        }

        button {
            background-color: #2d5a3d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #21452e;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🌿 Himalayan Plant Disease Identification</h1>

        <p>
            Upload an image of a Himalayan plant
            to identify possible diseases.
        </p>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <input
                type="file"
                name="plant_image"
                accept=".jpg,.jpeg,.png"
                required
            >

            <br>

            <button type="submit">
                Upload Plant Image
            </button>

        </form>

    </div>

</body>

</html>
